spring:
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${POSTGRES_SCHEMA:notification_schema}

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: notification_schema
    default-schema: notification_schema

  kafka:
    bootstrap-servers: kafka:29092

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}

    distribution:
      percentiles-histogram:
        "[notification.fanout.total]": true
        "[notification.fanout.save]": true
        "[notification.fanout.flush]": true
        "[notification.fanout.commit]": true

      slo:
        "[notification.fanout.total]": 500ms,1s,2s

  info:
    env:
      enabled: true

logging:
  level:
    com.parut.notification: info
    org.hibernate.SQL: off
    org.hibernate.orm.jdbc.bind: off
