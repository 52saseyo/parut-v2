spring:
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${POSTGRES_SCHEMA:product_schema}

  flyway:
    enabled: true
    out-of-order: true
    locations: classpath:db/migration
    schemas: product_schema
    default-schema: product_schema

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

server:
  tomcat:
    # Tomcat Busy/Current Thread 메트릭을 Actuator로 노출하기 위해 활성화한다.
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true


logging:
  level:
    com.parut.product: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

parut:
  product-stock:
    scheduler-rate: ${PRODUCT_STOCK_RATE:5m}
    reservation-ttl: ${PRODUCT_STOCK_RESERVATION_TTL:5m}
