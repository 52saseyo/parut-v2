apiVersion: 1

groups:
  - orgId: 1
    name: PARUT 서비스 모니터링
    folder: PARUT Alerts
    interval: 1m
    rules:
      - uid: parut-service-down
        title: 서비스 메트릭 수집 실패
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'up{job=~".*-service"}'
              instant: true
              intervalMs: 15000
              legendFormat: '{{job}}'
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        dashboardUid: parut-logs
        panelId: 9
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        annotations:
          summary: '서비스 메트릭 수집 실패: {{ $labels.job }}'
          description: 'Prometheus가 {{ $labels.job }} 서비스의 메트릭을 1분 이상 수 집하지 못했습니다.'
        labels:
          severity: critical
          source: prometheus

      - uid: parut-error-log-spike
        title: ERROR 로그 급증
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum by (service_name) (count_over_time({service_name=~".*-service", level="error"}[5m]))'
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 2
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        dashboardUid: parut-logs
        panelId: 8
        noDataState: OK
        execErrState: Alerting
        for: 1m
        annotations:
          summary: '{{ $labels.service_name }} ERROR 로그 급증'
          description: '{{ $labels.service_name }}에서 최근 5분간 ERROR 로그가 3건 이상 발생한 상태가 1분 이상 지속됐습니다.'
        labels:
          severity: warning
          source: loki
