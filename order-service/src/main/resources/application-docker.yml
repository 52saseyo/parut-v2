spring:
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${POSTGRES_SCHEMA:order_schema}

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: order_schema
    default-schema: order_schema

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true

logging:
  level:
    com.parut.order: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

# 로컬 검증에서 배송 상태 전이를 빠르게 확인하기 위한 설정이며 운영 기본값은 변경하지 않는다.
delivery:
  completion:
    delay-seconds: 10
    fixed-delay: 1s

# 로컬 성능 측정 대기를 줄이기 위해 정산 자동 완료를 매분 실행하며 운영 기본값(매일 03시)은 변경하지 않는다.
settlement:
  completion:
    cron: "0 * * * * *"
