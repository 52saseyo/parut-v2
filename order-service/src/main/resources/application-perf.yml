# 로컬 독립 검증 전용이며 개발 DB 연결 설정을 사용하지 않는다.
spring:
  datasource:
    url: ${PERF_DB_URL:jdbc:postgresql://localhost:55433/settlement_perf}
    username: settlement_perf
    password: settlement_perf_local
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: order_schema
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: order_schema
    default-schema: order_schema

toss:
  enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.parut.order: info
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

# 정산 완료 측정에 다른 DB 작업이 섞이지 않도록 배송 자동완료와 자동 구매확정을 끈다.
delivery:
  completion:
    enabled: false

order:
  auto-confirmation:
    enabled: false

settlement:
  completion:
    chunk-size: 100
    # 측정 대기를 줄이기 위해 매분 실행한다.
    cron: "0 * * * * *"

app:
  system-account-id: f9000000-0000-4000-8000-000000000099
