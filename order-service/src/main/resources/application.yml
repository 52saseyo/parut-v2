spring:
  application:
    name: order
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
    open-in-view: false

# Product의 internal.service-key와 동일 네이밍, 팀 공식 컨벤션은 아직 아님
internal:
  service-key: ${INTERNAL_SERVICE_KEY:local-dev-key}

product-service:
  base-url: ${PRODUCT_URL:http://localhost:8082}

payment:
  success-url: ${PAYMENT_SUCCESS_URL:http://localhost:3000/payments/success}
  fail-url: ${PAYMENT_FAIL_URL:http://localhost:3000/payments/fail}

toss:
  enabled: ${TOSS_ENABLED:true}
  client-key: ${TOSS_CLIENT_KEY:}
  secret-key: ${TOSS_SECRET_KEY:}
  base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}

# 유저 테이블에 SYSTEM 계정이 생성되면 실제 UUID로 교체 필요
app:
  system-account-id: ${SYSTEM_ACCOUNT_ID:00000000-0000-0000-0000-000000000000}

logging:
  level:
    root: info
  pattern:
    level: "%5p [%X{traceId:-}]"

# 정산 자동 완료: 매일 03시(한국 시간)에 실행하며 처리자는 위 app.system-account-id를 사용한다.
settlement:
  completion:
    cron: "0 0 3 * * *"

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
