spring:
  application:
    name: user-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
    open-in-view: false


jwt:
  secret: ${JWT_SECRET:v3ry-s3cr3t-k3y-f0r-p4rut-ms4-jwt-t0k3n-s3cur1ty!@#must-be-long-enough}
  access-token-expire: ${JWT_ACCESS_TOKEN_EXPIRE:30m}
  refresh-token-expire: ${JWT_REFRESH_TOKEN_EXPIRE:8h}

internal:
  service-key: ${INTERNAL_SERVICE_KEY:local-dev-key}

feign:
  client:
    config:
      default:
        connectTimeout: 3000 # 타임아웃 3초 (MS)
        readTimeout: 5000    # 응답 대기 5초 (MS)
        loggerLevel: BASIC   # 요청/응답 요약 로그

logging:
  level:
    root: info



order-service:
  url: ${ORDER_URL:http://localhost:8083}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
