server:
  port: 8080

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              #uri: ${USER_URL:http://localhost:8081}
              uri: http://user-service:8080
              predicates:
                - Path=/api/v1/users/**, /api/v1/sellers/**, /api/v1/auth/**
              filters:
                - name: JwtAuthFilter

            - id: product-service
              #uri: ${PRODUCT_URL:http://localhost:8082}
              uri: http://product-service:8080
              predicates:
                - Path=/api/v1/products/**, /api/v1/seller/products/**, /api/v1/seller/time-deals/**, /api/v1/stocks/**, /api/v1/time-deals/**, /api/v1/images/**
              filters:
                - name: JwtAuthFilter

            - id: order-service
              #uri: ${ORDER_URL:http://localhost:8083}
              uri: http://order-service:8080
              predicates:
                - Path=/api/v1/carts/**, /api/v1/orders/**, /api/v1/payments/**, /api/v1/deliveries/**, /api/v1/admin/deliveries/**, /api/v1/order-items/**, /api/v1/refunds/**, /api/v1/admin/refunds/**, /api/v1/settlements/**, /api/v1/admin/settlements/**
              filters:
                - name: JwtAuthFilter

            - id: notification-service
              #uri: ${NOTIFICATION_URL:http://localhost:8084}
              uri: http://notification-service:8080
              predicates:
                - Path=/api/v1/notifications/**, /api/v1/notification-subscriptions/**
              filters:
                - name: JwtAuthFilter

jwt:
  secret: ${JWT_SECRET:v3ry-s3cr3t-k3y-f0r-p4rut-ms4-jwt-t0k3n-s3cur1ty!@#must-be-long-enough}

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
